id: invoice-acme
file: files/invoice-acme.pdf
tags: [invoice]
expect:
  text_contains:
    - "Total due $10.00"
  reading_order:
    - ["Invoice", "Widget"]
  tables:
    - page: 1
      header: ["Item", "Qty"]
      rows: 1
      cols: 2
      cells:
        - {row: 0, col: Item, value: Widget}
  fields:
    total: "10.00"
