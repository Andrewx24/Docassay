name: CI

# Job-level path filters, not workflow-level ones. A docs-only pull request
# still reports spec, python, js, and parity so branch protection can require
# those names (ALI-309). The installs and tests are skipped unless a relevant
# path changed. The docs site builds in docs.yml (ALI-338).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      spec: ${{ steps.filter.outputs.spec }}
      python: ${{ steps.filter.outputs.python }}
      js: ${{ steps.filter.outputs.js }}
      parity: ${{ steps.filter.outputs.parity }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            files="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")"
          else
            before="${{ github.event.before }}"
            if [[ -z "$before" || "$before" == 0000000000000000000000000000000000000000 ]]; then
              files="$(git ls-files)"
            else
              files="$(git diff --name-only "$before" HEAD)"
            fi
          fi
          echo "Changed files:"
          printf '%s\n' "$files"

          spec=false
          python=false
          js=false
          parity=false
          while IFS= read -r f; do
            if [[ -z "$f" ]]; then
              continue
            fi
            case "$f" in
              spec/*|scripts/*|VERSION|.github/workflows/ci.yml|python/src/docassay/models/*|js/src/models/*)
                spec=true
                ;;
            esac
            case "$f" in
              python/*|spec/*|scripts/*|VERSION|.github/workflows/ci.yml)
                python=true
                ;;
            esac
            case "$f" in
              js/*|spec/*|scripts/*|VERSION|.github/workflows/ci.yml)
                js=true
                ;;
            esac
            case "$f" in
              python/*|js/*|spec/*|scripts/*|.github/workflows/ci.yml)
                parity=true
                ;;
            esac
          done <<< "$files"

          echo "spec=$spec" >> "$GITHUB_OUTPUT"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "js=$js" >> "$GITHUB_OUTPUT"
          echo "parity=$parity" >> "$GITHUB_OUTPUT"

  spec:
    name: spec
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Nothing relevant changed
        if: needs.changes.outputs.spec != 'true'
        run: echo "No spec/, scripts/, VERSION, generated-model, or CI workflow changes."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.spec == 'true'

      - uses: actions/setup-node@v4
        if: needs.changes.outputs.spec == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - uses: actions/setup-python@v5
        if: needs.changes.outputs.spec == 'true'
        with:
          python-version: "3.12"

      # ruff is pinned to the version in python/poetry.lock. datamodel-code-generator
      # is pinned to the release that reproduces the committed models.
      - name: Install generators
        if: needs.changes.outputs.spec == 'true'
        run: python -m pip install 'datamodel-code-generator==0.86.0' 'ruff==0.8.6'

      - name: Install script dependencies
        if: needs.changes.outputs.spec == 'true'
        run: npm ci --prefix scripts

      - name: Validate schemas and examples
        if: needs.changes.outputs.spec == 'true'
        run: node scripts/validate-spec.mjs

      - name: Regenerated models match the commit
        if: needs.changes.outputs.spec == 'true'
        shell: bash
        run: |
          ./scripts/gen-types.sh
          git diff --exit-code || { git diff --stat; git diff; exit 1; }

      - name: Package versions match VERSION
        if: needs.changes.outputs.spec == 'true'
        run: ./scripts/sync-version.sh --check

  python-matrix:
    name: python (${{ matrix.python-version }}, ${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.os }}
    env:
      POETRY_VIRTUALENVS_CREATE: "true"
      POETRY_VIRTUALENVS_IN_PROJECT: "true"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: snok/install-poetry@v1
        with:
          version: "2.5.1"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: python/.venv
          key: poetry-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('python/poetry.lock') }}

      - name: Install dependencies
        working-directory: python
        run: poetry install --no-interaction --no-ansi

      - name: Lint
        working-directory: python
        run: poetry run ruff check .

      - name: Format
        working-directory: python
        run: poetry run ruff format --check .

      - name: Typecheck
        working-directory: python
        run: poetry run mypy src

      - name: Test
        working-directory: python
        run: poetry run pytest --cov=docassay --cov-report=term-missing

  python:
    name: python
    needs: [changes, python-matrix]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the Python matrix
        shell: bash
        run: |
          changes="${{ needs.changes.result }}"
          matrix="${{ needs.python-matrix.result }}"
          echo "changes=$changes python-matrix=$matrix"
          if [[ "$changes" != "success" ]]; then
            echo "Could not tell which files changed, so Python was not tested."
            exit 1
          fi
          if [[ "$matrix" == "success" || "$matrix" == "skipped" ]]; then
            exit 0
          fi
          echo "Python matrix failed ($matrix)."
          exit 1

  js-matrix:
    name: js (${{ matrix.node-version }}, ${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install dependencies
        working-directory: js
        run: npm ci

      - name: Lint
        working-directory: js
        run: npm run lint

      - name: Typecheck
        working-directory: js
        run: npm run typecheck

      - name: Test
        working-directory: js
        run: npm test

      - name: Build
        working-directory: js
        run: npm run build

  js:
    name: js
    needs: [changes, js-matrix]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the Node matrix
        shell: bash
        run: |
          changes="${{ needs.changes.result }}"
          matrix="${{ needs.js-matrix.result }}"
          echo "changes=$changes js-matrix=$matrix"
          if [[ "$changes" != "success" ]]; then
            echo "Could not tell which files changed, so JavaScript was not tested."
            exit 1
          fi
          if [[ "$matrix" == "success" || "$matrix" == "skipped" ]]; then
            exit 0
          fi
          echo "Node matrix failed ($matrix)."
          exit 1

  parity:
    name: parity
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Nothing relevant changed
        if: needs.changes.outputs.parity != 'true'
        run: echo "No package, spec, or script changes to compare."

      - uses: actions/checkout@v4
        if: needs.changes.outputs.parity == 'true'

      # ALI-321 adds scripts/parity.sh. Until then this job stays green.
      - name: Run parity script when it exists
        if: needs.changes.outputs.parity == 'true'
        shell: bash
        run: |
          if [[ -f scripts/parity.sh ]]; then
            bash scripts/parity.sh
          else
            echo "scripts/parity.sh is added by ALI-321. Nothing to compare yet."
          fi
